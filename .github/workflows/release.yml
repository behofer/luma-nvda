name: Release

# Builds the .nvda-addon package and publishes a GitHub release whenever a
# version tag (v*) is pushed. Release notes are taken from
# .github/release-notes/<tag>.md when present.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build add-on package
        run: python3 build.py

      - name: Locate artifact
        id: artifact
        run: |
          file=$(ls luma-*.nvda-addon)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          version="${file#luma-}"
          version="${version%.nvda-addon}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.file }}
          path: ${{ steps.artifact.outputs.file }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Luma ${{ steps.artifact.outputs.version }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: ${{ steps.artifact.outputs.file }}
